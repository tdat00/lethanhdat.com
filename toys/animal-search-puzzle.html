<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16745b">
  <meta name="description" content="Trò chơi tìm chuỗi con vật bằng hình ảnh cho trẻ chưa biết chữ. 22 mặt thú hoạt hình, đáp án ngẫu nhiên từ 2 đến 7 hình và in giấy A4.">
  <title>Mê cung con vật</title>
  <link rel="canonical" href="https://lethanhdat.com/toys/animal-search-puzzle.html">
  <link rel="stylesheet" href="animal-search-puzzle.css">
  <script src="animal-faces.js" defer></script>
  <script src="animal-search-puzzle.js" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3ZM20 2v4m-2-2h4"/></symbol>
    <symbol id="icon-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7zM16 11h1"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M8 3h8v7a4 4 0 0 1-8 0V3ZM8 5H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4m-4 2v7m-5 0h10"/></symbol>
  </svg>
  <nav class="game-menu" aria-label="Chọn trò chơi" data-i18n-aria-label="gamesMenu">
    <p class="game-menu-title" data-i18n="gamesTitle">Trò chơi</p>
    <a class="game-menu-link" href="word-search-puzzle.html"><span class="game-menu-mark" aria-hidden="true">Aa</span><span data-i18n="gameWords">Tìm chữ</span></a>
    <a class="game-menu-link" href="find-number-puzzle.html"><span class="game-menu-mark" aria-hidden="true">#</span><span data-i18n="gameNumbers">Tìm số</span></a>
    <a class="game-menu-link" href="animal-search-puzzle.html" aria-current="page"><span class="game-menu-mark" aria-hidden="true">◉</span><span data-i18n="gameAnimals">Tìm con vật</span></a>
  </nav>
  <div class="shell">
    <header class="site-header">
      <div class="brand"><img id="brand-face" class="brand-face" alt="" width="48" height="48"><div><h1 data-i18n="brand">mê cung con vật</h1><span class="brand-tagline" data-i18n="tagline">CHƠI · HỌC · KHÁM PHÁ</span></div></div>
      <details id="language-picker" class="language-picker">
        <summary id="language-toggle" aria-labelledby="language-label language-current"><img id="language-flag" src="../assets/images/flag-vn.png" width="24" height="16" alt=""><span id="language-current" lang="vi">Tiếng Việt</span></summary>
        <fieldset id="language" class="language-options"><legend id="language-label" class="sr-only" data-i18n="language">Ngôn ngữ</legend>
          <label lang="vi"><img src="../assets/images/flag-vn.png" width="24" height="16" alt=""><span>Tiếng Việt</span><input type="radio" name="language" value="vi" checked></label>
          <label lang="en"><img src="../assets/images/flag-us.png" width="24" height="16" alt=""><span>English</span><input type="radio" name="language" value="en"></label>
        </fieldset>
      </details>
    </header>
    <main>
      <details class="settings" id="settings">
        <summary data-i18n="settingsTitle">Thiết kế thử thách</summary>
        <form id="settings-form" novalidate>
          <div class="size-fields"><label for="rows"><span data-i18n="rows">Số hàng</span><input id="rows" type="number" value="8" min="5" max="12" step="1" required></label><label for="cols"><span data-i18n="cols">Số cột</span><input id="cols" type="number" value="8" min="5" max="12" step="1" required></label></div>
          <label for="target-count"><span data-i18n="targetCount">Số đáp án</span><input id="target-count" type="number" value="6" min="3" max="8" step="1" required></label>
          <label for="max-length"><span data-i18n="maxLength">Kích thước nhóm (tối đa)</span><input id="max-length" type="number" value="7" min="2" max="7" step="1" required></label>
          <fieldset class="image-style"><legend data-i18n="imageStyle">Hình ảnh</legend><div class="mode-grid">
            <label class="mode"><input type="radio" name="image-style" value="color" checked><span class="color-swatch" aria-hidden="true"></span><span data-i18n="color">Có màu</span></label>
            <label class="mode"><input type="radio" name="image-style" value="monochrome"><span class="color-swatch monochrome" aria-hidden="true"></span><span data-i18n="monochrome">Trắng đen</span></label>
            <label class="mode"><input type="radio" name="image-style" value="minimal"><span class="color-swatch minimal" aria-hidden="true"></span><span data-i18n="minimal">Tối giản</span></label>
          </div></fieldset>
          <fieldset class="directions"><legend data-i18n="directions">Hướng tìm</legend><div class="mode-grid">
            <label class="mode"><input type="checkbox" name="mode" value="horizontal" checked><span data-i18n="horizontal">Ngang</span><span class="direction" aria-hidden="true">→</span></label>
            <label class="mode"><input type="checkbox" name="mode" value="vertical" checked><span data-i18n="vertical">Dọc</span><span class="direction" aria-hidden="true">↓</span></label>
            <label class="mode"><input type="checkbox" name="mode" value="diagonal"><span data-i18n="diagonal">Chéo</span><span class="direction" aria-hidden="true">↘</span></label>
            <label class="mode"><input type="checkbox" name="mode" value="reverse"><span data-i18n="reverse">Ngược</span><span class="direction" aria-hidden="true">↔</span></label>
          </div></fieldset>
          <button class="button primary" type="submit"><svg class="icon" aria-hidden="true"><use href="#icon-spark"/></svg><span data-i18n="apply">Tạo bảng</span></button>
        </form>
      </details>
      <p id="form-error" role="alert" hidden></p>
      <section class="puzzle-panel" aria-labelledby="panel-title">
        <div class="panel-toolbar"><div class="panel-heading"><h2 id="panel-title" data-i18n="panelTitle">Tìm bạn nhỏ</h2><span id="puzzle-meta"></span></div><div class="actions">
          <button id="generate-button" type="submit" form="settings-form" class="button primary" data-i18n-title="generate" title="Bảng mới"><svg class="icon" aria-hidden="true"><use href="#icon-spark"/></svg><span data-i18n="generate">Bảng mới</span></button>
          <button id="print-button" type="button" class="button icon-button" disabled data-i18n-title="print" data-i18n-aria-label="print" title="In A4" aria-label="In A4"><svg class="icon" aria-hidden="true"><use href="#icon-print"/></svg></button>
        </div></div>
        <div id="puzzle-content" hidden>
          <div class="paper-title" data-i18n="brand">mê cung con vật</div>
          <div class="play-area">
            <section class="target-bank" aria-labelledby="targets-title"><div class="bank-heading"><h3 id="targets-title" data-i18n="targetsTitle">Các nhóm bạn</h3><span id="found-count"></span></div><ul id="target-list"></ul><progress id="game-progress" value="0" max="6" aria-label="Tiến độ" data-i18n-aria-label="progress"></progress></section>
            <div class="board-area">
              <div id="board-scroll" tabindex="0" role="region" aria-label="Bảng con vật" data-i18n-aria-label="panelTitle"><div id="animal-grid" role="grid" aria-label="Bảng con vật" data-i18n-aria-label="panelTitle"></div></div>
              <div class="selection-bar"><div id="selection-preview" aria-hidden="true"></div><button id="cancel-selection" type="button" class="button icon-button" disabled data-i18n-title="cancel" data-i18n-aria-label="cancel" title="Bỏ chọn" aria-label="Bỏ chọn"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button></div>
              <div class="feedback" id="feedback"><svg class="icon" id="feedback-icon" aria-hidden="true" hidden><use href="#icon-check"/></svg><p id="game-status" role="status" aria-live="polite" class="sr-only"></p><span id="completion" hidden><svg class="icon trophy" aria-hidden="true"><use href="#icon-trophy"/></svg><span data-i18n="complete">Tìm thấy hết rồi!</span></span></div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer"><span data-i18n="footer">Một chút tập trung, một niềm vui nhỏ.</span><span><span id="sequence-length-range">2–7</span> <span data-i18n="perSequence">con vật / đáp án</span></span></footer>
  </div>
  <noscript><p lang="vi">Bật JavaScript để chơi.</p><p lang="en">Enable JavaScript to play.</p></noscript>
</body>
</html>
